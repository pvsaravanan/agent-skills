<!--
  STARTER OPENER / PROMO / BUMPER / INTRO / TYPOGRAPHY — one file (category: opener).
  This is ARCHITECTURE + TOOLING, not a style and not a skeleton: a 1920x1080 stage, a
  #world camera rig, a stateful Three.js scene, 8 text entrances, optional transitions,
  autoplay + loop with no player (?debug=1 = scrub panel, ?demo=1 = text-entrance demo).
  DELIBERATELY WITHOUT A SAMPLE SCENE ORDER. The skeleton (concept, scene count, main object,
  opening, closing) comes from references/opener-concepts.md — not from this file.

  =====  STYLE BRIEF — fill it in first, then touch the code (SKILL.md Law #3)  =====
  Theme/product + 3 adjectives : ____________________
  Concept (opener-concepts.md)  : candidate 1 ______ / 2 ______ / 3 ______  -> chosen: ______
  Structure fingerprint         : concept · n scenes · object of each scene · opening · closing
  Palette (from the brand)      : main #______  background #______  accent #______
  Display / companion font      : ____________  / ____________   (not Poppins/Inter/Roboto/Montserrat)
  Background language (1 direction) : dark cinematic | color-block poster | light editorial | paper & print |
                                analog retro | mono brutalist | cheerful pastel | dark luxury
  Motion signature (object)     : ____________________
  Background motion (menu §7c)  : ____________________
  Background surface (menu §7d) : ____________________   (gradient/light/texture, not flat)
  Transitions (menu §4c, ≥2 kinds, ≥1 3D) : ____________________   (no flat bars/squares sweeping)
  Special moment                : ____________________
  ==========================================================================

  Every color below is deliberately GRAY and the font is a system font: if they are still
  visible in the result, the style was not derived from the theme. The WebGL background (nebula,
  dust, grid, bloom) is only ONE background language; for another direction turn it off
  (S.grid/dust/stars = 0, hide #gl, replace the #stage/.bgfx background).
  BACKGROUND MOTION is chosen from the techniques.md §7c menu (fill it in the style brief) — do not
  automatically use "objects drifting sideways"; that has already been used by two projects in a row.
  Do not imitate a reference video's skin and do not open old projects.
-->

{"imports":{

<style>
:root{
  /* PLACEHOLDER — must be replaced from the style brief. Gray = not yet derived from the theme. */
  --accent:#8A8F98; --accent-lit:#C4C8CF;
  --ink:#F2F3F7; --base:#111318;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"Sora",system-ui,sans-serif;color:var(--ink)}   /* REPLACE: the display font from the style brief */
#filters{position:fixed;width:0;height:0;opacity:0;pointer-events:none}

/* the stage is pinned at 1920x1080, scaled to the window — the composition does not change */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(1);overflow:hidden;background:var(--base)}
#world{position:absolute;inset:0;will-change:transform}   /* camera rig */
#gl{position:absolute;inset:0;width:1920px;height:1080px;display:block}
.bgfx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(70% 42% at 50% 108%,
    color-mix(in srgb, var(--accent) 34%, transparent),
    color-mix(in srgb, var(--accent) 12%, transparent) 48%, transparent 70%)}
#dom{position:absolute;inset:0}

.scene{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;opacity:0;visibility:hidden}

/* the initial state is hidden IN CSS (tweens use immediateRender:false).
   Never write opacity in a selector more specific than this one. */
.hero{opacity:0}

.hero-wrap{perspective:1400px}
.hero.sm{font-size:74px}.hero.md{font-size:92px}.hero.lg{font-size:128px}.hero.xl{font-size:150px;font-weight:600}
.txt2{display:inline-block;opacity:0}                      /* OPTIONAL punctuation: only when the sentence actually has punctuation */
/* OPTIONAL highlight word (the style brief may choose no highlight): .hl + ONE shape variant: pill | under | marker | box | color. Ornaments are not the default. */
.hl{position:relative;display:inline-block}
.hl i{position:absolute;transform:scaleX(0);transform-origin:0 50%}
.hl-t{position:relative;opacity:0}
.hl.pill{padding:.02em .24em .04em;border-radius:.26em}
.hl.pill i{inset:0;border-radius:inherit;background:linear-gradient(95deg,color-mix(in srgb,var(--accent) 70%,#000),var(--accent) 60%,var(--accent-lit))}
.hl.pill .hl-t{color:#fff}
.hl.under i{left:0;right:0;bottom:-.04em;height:.14em;border-radius:.07em;background:var(--accent)}
.hl.marker i{left:-.1em;right:-.1em;top:.5em;bottom:-.02em;background:var(--accent);opacity:.55;transform:scaleX(0) rotate(-1.5deg)}
.hl.box i{inset:-.06em -.14em;border:.04em solid var(--accent);border-radius:.12em;background:none}
.hl.color .hl-t{color:var(--accent)}
.hl-orn{position:absolute;width:.46em;height:.46em;right:-.22em;top:-.24em;fill:var(--accent-lit);opacity:0}   /* OPTIONAL: a shape from the brand */
.paper{position:absolute;inset:0;opacity:0;visibility:hidden;
  background:linear-gradient(180deg,#F7FAFF 0%,#EEF4FF 55%,#E6EEFF 100%)}   /* light background (sample; may be a palette-color gradient / color block) */
.paper .b{position:absolute;border-radius:50%;pointer-events:none}
.paper .b1{left:-260px;top:-380px;width:1100px;height:1100px;background:radial-gradient(circle,color-mix(in srgb,var(--accent-lit) 38%,#fff) 0%,transparent 68%)}
.paper .b2{left:1180px;top:520px;width:1000px;height:1000px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,#fff) 0%,transparent 66%)}
.paper .b3{left:420px;top:700px;width:800px;height:800px;background:radial-gradient(circle,color-mix(in srgb,var(--accent-lit) 26%,#fff) 0%,transparent 66%)}
.hero.ink{color:#0B1B33;text-shadow:none}                  /* text for a light background */
.pocket{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(60% 46% at 50% 50%,rgba(0,0,0,.55),transparent 72%)}   /* a dark pocket beneath the text */
.hero{font-size:142px;font-weight:500;letter-spacing:-.01em;color:#fff;
  white-space:nowrap;text-shadow:0 4px 30px rgba(0,0,0,.5)}  /* NO glow */
#line-a{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block;will-change:transform,opacity,filter;opacity:0} /* starts at 0: prevents a flash before the tween */

/* light leak: the TOPMOST layer (light in front of the lens, not part of the world) */
.leak{position:absolute;left:50%;top:50%;width:2400px;height:2400px;
  margin:-1200px 0 0 -1200px;border-radius:50%;
  background:radial-gradient(circle,
    color-mix(in srgb, var(--accent-lit) 85%, white),
    color-mix(in srgb, var(--accent) 55%, transparent) 34%,
    transparent 74%);
  filter:blur(64px);mix-blend-mode:screen;opacity:0;pointer-events:none;z-index:40}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:10;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 30%),
    radial-gradient(ellipse 78% 68% at 50% 52%,transparent 40%,
      rgba(0,0,0,.6) 86%,rgba(0,0,0,.92) 100%)}

#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:11px 18px;border-radius:16px;
  background:rgba(14,16,22,.9);border:1px solid rgba(255,255,255,.1);
  font-size:13px;color:#A0A6B4;z-index:50}
#ui{display:none}            /* developer panel: shown only with ?debug=1 */
#ui.on{display:flex}
#ui button{background:#262A34;color:#fff;border:none;padding:8px 16px;
  border-radius:9px;font:inherit;cursor:pointer}
#scrub{width:340px;accent-color:var(--accent)}
#clock{font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right} /* equal-width digits: the card does not jitter */
</style>

<body>

<svg id="filters"><defs></defs></svg>

<div id="stage">
  <div id="world">
    <canvas id="gl"></canvas>
    <div class="bgfx"></div>
    <div id="dom">
      <div class="paper" id="paper"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i></div>
      <div class="pocket" id="pocket"></div>
      <!-- The scenes, their number, and their order are written from the CONCEPT rundown (references/opener-concepts.md).
           A scene does not have to be "a sentence + an object": it may be product action with no text, pure typography,
           or several objects reacting to each other. The elements below are only PLACEHOLDERS for ?demo=1. -->
      <section class="scene" id="sc-a"><div class="hero-wrap">
        <!-- only .txt is split per letter; the highlight (.hl) and punctuation (.txt2, optional) have their own tweens.
             The highlight (.hl) is OPTIONAL: delete its span if the style brief chooses no highlight. If used, the variant
             (pill/under/marker/box/color) comes from the style brief, not required in every sentence; ornaments only from brand shapes. -->
        <h1 class="hero md" id="line-a"><span class="txt">The text entrance is chosen from the meaning of the</span>&nbsp;<span class="hl under" id="hl-a"><i></i><span class="hl-t">sentence</span></span></h1>
      </div></section>
    </div>
  </div>
  <div class="leak" id="leak"></div>
  <div class="vignette"></div>
</div>

<div id="ui">
  <button id="btn-play">Pause</button><button id="btn-restart">Restart</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="clock">0.00s</span>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

/* ============ UTIL: per-letter split + directional motion blur ============ */
const $=(s,r=document)=>r.querySelector(s);
const defs=$('#filters defs'); let fc=0;
function makeBlur(){ // feGaussianBlur with separate x/y stdDeviation = blur ALONG the direction of motion
  const id='mb'+(fc++), NS='http://www.w3.org/2000/svg';
  const f=document.createElementNS(NS,'filter'); f.id=id;
  f.setAttribute('x','-70%');f.setAttribute('y','-70%');           // the default box
  f.setAttribute('width','240%');f.setAttribute('height','240%');  // clips the tail
  const g=document.createElementNS(NS,'feGaussianBlur');
  g.setAttribute('stdDeviation','0 0'); f.appendChild(g); defs.appendChild(f);
  return {url:`url(#${id})`,node:g};
}
function blurTween(tl,targets,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){
  const b=makeBlur(),o={v:from};
  tl.set(targets,{filter:b.url},at);
  tl.to(o,{v:to,duration:dur,ease,onUpdate(){
    b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);
  tl.set(targets,{filter:'none'},at+dur); // release: a permanent filter = re-rasterizing every frame
}
const VERT={ax:.1,ay:1};
function splitChars(el){
  const words=(el.textContent||'').split(' '); el.textContent=''; const out=[];
  words.forEach((w,i)=>{
    const wr=document.createElement('span'); wr.className='wd';
    for(const c of w){const s=document.createElement('span');s.className='ch';
      s.textContent=c;wr.appendChild(s);out.push(s);}
    el.appendChild(wr);
    if(i<words.length-1){const sp=document.createElement('span');sp.className='ch';
      sp.innerHTML='&nbsp;';el.appendChild(sp);out.push(sp);}
  });
  return out;
}

/* ============ STATEFUL WEBGL WORLD (no clock of its own) ============ */
const W=1920,H=1080;
const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
/* ALL WebGL colors are derived from the CSS tokens (style brief). There are no hardcoded colors in the 3D layer:
   change --accent/--accent-lit/--base in :root and the whole world follows. The ornament shape (a 4-point star) is also
   a placeholder — derive it from the logo/theme (starShape) or replace the geometry. */
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ACC=new THREE.Color(cssVar('--accent')),ACL=new THREE.Color(cssVar('--accent-lit')),BASE=new THREE.Color(cssVar('--base'));
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(BASE.getHex(),.012);
const camera=new THREE.PerspectiveCamera(50,W/H,.1,400);

const S={ grid:.3, dust:.5, stars:0, camX:0,camY:0,camZ:16,camRoll:0,
          bloom:.85, shake:0, heroO:0,heroS:1,heroX:0,heroY:0,heroZ:6 };

/* dust: twinkling via a per-seed sine — not random per frame */
{const N=1200,pos=new Float32Array(N*3),seed=new Float32Array(N);
 for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*90;pos[i*3+1]=(Math.random()-.5)*52;
   pos[i*3+2]=-Math.random()*60+8;seed[i]=Math.random()*6.283;}
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
 var dustMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uOpacity:{value:.5},uPix:{value:Math.min(devicePixelRatio,2)},uColor:{value:ACL}},
  vertexShader:`attribute float aSeed;varying float vA;uniform float uTime;uniform float uPix;
   void main(){vec3 p=position;p.y+=sin(uTime*.35+aSeed)*.9;
   vec4 mv=modelViewMatrix*vec4(p,1.);vA=.35+.65*abs(sin(uTime*.9+aSeed*3.1));
   gl_PointSize=(28.*uPix)/(-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;uniform float uOpacity;uniform vec3 uColor;
   void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;
   gl_FragColor=vec4(uColor,pow(1.-d*2.,2.4)*vA*uOpacity);}`});
 scene.add(new THREE.Points(g,dustMat));}

/* floor grid: fades FAR before the horizon (lines piling up = a bright band) */
const gridMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
 blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
 uniforms:{uTime:{value:0},uOpacity:{value:0},uC1:{value:ACC},uC2:{value:ACL}},
 vertexShader:`varying vec2 vUv;void main(){vUv=uv;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec2 vUv;uniform float uTime;uniform float uOpacity;uniform vec3 uC1;uniform vec3 uC2;
  void main(){vec2 p=vUv*46.;p.y+=uTime*2.6;
  vec2 g=abs(fract(p)-.5)/fwidth(p);float line=1.-min(min(g.x,g.y),1.);
  float d=length(vUv-.5)*2.;float fade=1.-smoothstep(.04,.60,d);
  gl_FragColor=vec4(mix(uC1,uC2,fade),line*fade*uOpacity);}`});
const grid=new THREE.Mesh(new THREE.PlaneGeometry(170,170),gridMat);
grid.rotation.x=-Math.PI/2; grid.position.y=-6.4; scene.add(grid);

/* 3D ornament: extrude + lighting (Basic = flat = PPT feel) */
scene.add(new THREE.AmbientLight(ACC.clone().multiplyScalar(.45).getHex(),1.1));
const key=new THREE.DirectionalLight(ACL.getHex(),2.6); key.position.set(5,7,9); scene.add(key);
function starShape(){const s=new THREE.Shape(),R=1,c=.09; // small c = pointed tips
 s.moveTo(0,R);s.quadraticCurveTo(c,c,R,0);s.quadraticCurveTo(c,-c,0,-R);
 s.quadraticCurveTo(-c,-c,-R,0);s.quadraticCurveTo(-c,c,0,R);return s;}
const starGeo=new THREE.ExtrudeGeometry(starShape(),{depth:.26,bevelEnabled:true,
 bevelThickness:.06,bevelSize:.07,bevelSegments:3}); starGeo.center();
const mkMat=()=>new THREE.MeshStandardMaterial({color:ACL.getHex(),emissive:ACC.getHex(),
 emissiveIntensity:.6,roughness:.28,metalness:.2,transparent:true,opacity:0});
const AMB=[[-9.5,4.2,-7,.62,.5,.7],[8.6,4.8,-9,.8,-.36,2.1],[-7.2,-3.8,-4,.44,.62,3.9],
 [9.4,-3.2,-7,.55,-.55,1.3],[5.8,5.9,-3,.34,-.7,.2],[3.4,-5.4,-11,.7,.42,4.4]];
const ambStars=AMB.map(d=>{const m=new THREE.Mesh(starGeo,mkMat());
 m.position.set(d[0],d[1],d[2]);m.scale.setScalar(d[3]);m.userData=d;scene.add(m);return m;});
const heroMat=mkMat();heroMat.emissiveIntensity=.85;
const heroStar=new THREE.Mesh(starGeo,heroMat);scene.add(heroStar);

const composer=new EffectComposer(renderer); composer.setSize(W,H);
composer.addPass(new RenderPass(scene,camera));
/* HIGH threshold — a low threshold fogs the whole frame white */
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.8,.7,.52);
composer.addPass(bloom); composer.addPass(new OutputPass());

function render(t){ // t = tl.time(); there is NO other clock in this file
  dustMat.uniforms.uTime.value=t; dustMat.uniforms.uOpacity.value=S.dust;
  gridMat.uniforms.uTime.value=t; gridMat.uniforms.uOpacity.value=S.grid;
  for(const m of ambStars){const d=m.userData,tw=.45+.55*Math.abs(Math.sin(t*.9+d[5]));
    m.material.opacity=S.stars*tw; m.visible=m.material.opacity>.01;
    m.rotation.z=t*d[4]+d[5];
    m.rotation.y=Math.sin(t*d[4]*1.4+d[5])*.55;  // sway, not a full spin
    m.position.y=d[1]+Math.sin(t*.5+d[5])*.5;}
  heroMat.opacity=S.heroO; heroStar.visible=S.heroO>.01;
  heroStar.position.set(S.heroX,S.heroY,S.heroZ);
  heroStar.scale.setScalar(1.6*S.heroS);
  heroStar.rotation.z=t*.45; heroStar.rotation.y=Math.sin(t*.7)*.6;
  const sh=S.shake;
  camera.position.set(S.camX+Math.sin(t*.41)*.22+Math.sin(t*137.2)*sh, // sine,
    S.camY+Math.cos(t*.33)*.16+Math.cos(t*111.7)*sh, S.camZ);          // not random
  camera.lookAt(S.camX*.35,S.camY*.35,0); camera.rotation.z+=S.camRoll;
  bloom.strength=S.bloom;
  composer.render();
}

/* ============ TIMELINE — the only place time is written ============ */
const Q=new URLSearchParams(location.search);
const DURATION=8.0;                       // REPLACE: from the concept rundown
const tl=gsap.timeline({paused:true});
const rig=$('#world'), leak=$('#leak');

/* ---- OPTIONAL TRANSITIONS (techniques.md §4c menu). DELIBERATELY not called in the starter.
   Push-through and light leak are canonical components: use them only when the concept demands it,
   at most two canonical components per opener (opener-concepts.md). ---- */
let leakSide=1;
const sweep=(at,dur=1.0)=>{ const side=(leakSide*=-1);   // the light leak alternates sides
  tl.fromTo(leak,{x:side*1500,y:-240,scale:.85},
    {x:side*330,y:130,scale:1.12,duration:dur,ease:'sine.out',immediateRender:false},at);
  tl.fromTo(leak,{opacity:0},{opacity:.85,duration:dur*.4,ease:'sine.in',immediateRender:false},at);
  tl.to(leak,{opacity:0,duration:dur*.6,ease:'sine.out'},at+dur*.4); };
/* push-through: push into the old subject, cut, pull back from the new subject (allowance ±1, motivated) */
const camThrough=(atCut,{push=2,from=1.5,inDur=.5,outDur=.95,
                         oOut='50% 50%',oIn='50% 50%'}={})=>{
  tl.set(rig,{transformOrigin:oOut},atCut-inDur);
  tl.to(rig,{scale:push,duration:inDur,ease:'power2.in'},atCut-inDur);
  tl.set(rig,{transformOrigin:oIn,scale:from},atCut);
  tl.to(rig,{scale:1,duration:outDur,ease:'power3.out'},atCut); };
/* camera breathing: a motion foundation that may always be present (techniques.md §4b); direction alternates per span */
const breathe=(from,to,{z0=1,z1=1.045,origin='50% 50%'}={})=>{
  tl.set(rig,{transformOrigin:origin},from);
  tl.fromTo(rig,{scale:z0},{scale:z1,duration:to-from,ease:'sine.inOut',immediateRender:false},from); };
/* switch the background behind a transition (techniques.md §7b) — call only when the style brief decides a segment changes mood */
const switchToLightBg=at=>{
  tl.set('#paper',{autoAlpha:1},at); tl.to('#gl',{opacity:0,duration:.25},at);
  tl.to('.vignette',{opacity:.35,duration:.4},at); tl.to('.bgfx',{opacity:0,duration:.25},at);
  tl.to('#pocket',{opacity:0,duration:.3},at-.1);
  tl.to('.paper .b',{x:60,y:-40,duration:3,ease:'sine.inOut',yoyo:true,repeat:1,stagger:.4},at); };

/* ---- 8 TEXT ENTRANCES (techniques.md §1). There is no default entrance: choose from the MEANING of the sentence,
   two scenes in a row do not use the same entrance. ch = the splitChars result, el = the sentence element. ---- */
const inUp   =(ch,el,at,{dur=.8,st=.024}={})=>{tl.fromTo(ch,{opacity:0,yPercent:60,scaleY:1.45},{opacity:1,yPercent:0,scaleY:1,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurTween(tl,el,at,30,0,dur,VERT);};
const inDown =(ch,el,at,{dur=.8,st=.024}={})=>{tl.fromTo(ch,{opacity:0,yPercent:-60,scaleY:1.45},{opacity:1,yPercent:0,scaleY:1,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurTween(tl,el,at,30,0,dur,VERT);};
const inLeft =(ch,el,at,{dur=.75,st=.02}={})=>{tl.fromTo(ch,{opacity:0,xPercent:-45},{opacity:1,xPercent:0,duration:dur,ease:'power4.out',stagger:st,immediateRender:false},at);blurTween(tl,el,at,50,0,dur,{ease:'power4.out'});};
const inRight=(ch,el,at,{dur=.75,st=.02}={})=>{tl.fromTo(ch,{opacity:0,xPercent:45},{opacity:1,xPercent:0,duration:dur,ease:'power4.out',stagger:{each:st,from:'end'},immediateRender:false},at);blurTween(tl,el,at,50,0,dur,{ease:'power4.out'});};
const inDepth=(ch,el,at,{dur=1,st=.018}={})=>{tl.fromTo(ch,{opacity:0,scale:2.4},{opacity:1,scale:1,duration:dur,ease:'expo.out',stagger:{each:st,from:'center'},immediateRender:false},at);blurTween(tl,el,at,22,0,dur,{ease:'expo.out',ax:1,ay:1});};
const inMask =(ch,el,at,{dur=.9,from='left'}={})=>{const c={left:'inset(0% 100% 0% 0%)',right:'inset(0% 0% 0% 100%)',up:'inset(100% 0% 0% 0%)',down:'inset(0% 0% 100% 0%)'}[from];
  tl.set(ch,{opacity:1,xPercent:0,yPercent:0,scale:1,scaleY:1},at);
  tl.fromTo(el,{clipPath:c},{clipPath:'inset(0% 0% 0% 0%)',duration:dur,ease:'power3.inOut',immediateRender:false},at);
  tl.set(el,{clipPath:'none'},at+dur);};
const inWords=(ch,el,at,{dur=.6,st=.14}={})=>{const w=el.querySelectorAll('.wd');
  tl.set(ch,{opacity:1,xPercent:0,yPercent:0,scale:1,scaleY:1},at);
  tl.fromTo(w,{opacity:0,yPercent:40,rotateX:-55},{opacity:1,yPercent:0,rotateX:0,duration:dur,ease:'back.out(1.6)',stagger:st,immediateRender:false},at);};
/* typing: for a PLAIN text element (not split) that is genuinely typed in the concept's world — not a default input box */
const typeOn =(el,at,{cps=18}={})=>{const str=el.dataset.full||(el.dataset.full=el.textContent);const o={i:0};
  tl.set(el,{autoAlpha:1},at);
  tl.fromTo(o,{i:0},{i:str.length,duration:str.length/cps,ease:'none',immediateRender:false,
    onUpdate(){el.textContent=str.slice(0,Math.round(o.i));}},at);};
const outUp   =(ch,el,at,{dur=.4,st=.01}={})=>{tl.to(ch,{opacity:0,yPercent:-70,duration:dur,ease:'power2.in',stagger:st},at);blurTween(tl,el,at,0,45,dur+.1,{ease:'power2.in',...VERT});};
const outDown =(ch,el,at,{dur=.4,st=.01}={})=>{tl.to(ch,{opacity:0,yPercent:70,duration:dur,ease:'power2.in',stagger:st},at);blurTween(tl,el,at,0,45,dur+.1,{ease:'power2.in',...VERT});};
const outLeft =(ch,el,at,{dur=.4,st=.01}={})=>{tl.to(ch,{opacity:0,xPercent:-60,duration:dur,ease:'power2.in',stagger:st},at);blurTween(tl,el,at,0,55,dur+.1,{ease:'power2.in'});};
const outRight=(ch,el,at,{dur=.4,st=.01}={})=>{tl.to(ch,{opacity:0,xPercent:60,duration:dur,ease:'power2.in',stagger:{each:st,from:'end'}},at);blurTween(tl,el,at,0,55,dur+.1,{ease:'power2.in'});};
const outDepth=(ch,el,at,{dur=.5,st=.008}={})=>{tl.to(ch,{opacity:0,scale:2.6,duration:dur,ease:'power2.in',stagger:{each:st,from:'center'}},at);blurTween(tl,el,at,0,30,dur+.1,{ease:'power2.in',ax:1,ay:1});};
const mark=(hl,at)=>{const i=$('i',hl);if(i)tl.fromTo(i,{scaleX:0},{scaleX:1,duration:.5,ease:'power3.out',immediateRender:false},at);   // the highlight's block/line, any variant
  tl.fromTo($('.hl-t',hl),{opacity:0,yPercent:60},{opacity:1,yPercent:0,duration:.7,ease:'power4.out',immediateRender:false},at);
  const orn=$('.hl-orn',hl);if(orn)tl.fromTo(orn,{opacity:0,scale:.2,rotate:-40},{opacity:1,scale:1,rotate:0,duration:.5,ease:'back.out(2)',immediateRender:false},at+.22);};
const popDot=(el,at)=>tl.fromTo(el,{opacity:0,yPercent:60},{opacity:1,yPercent:0,duration:.5,ease:'power4.out',immediateRender:false},at);

/* ---- BACKGROUND: the world's initial state. PLACEHOLDER — derive it from the style brief, turn WebGL off if the direction differs. ---- */
tl.set('#paper',{autoAlpha:0},0); tl.set(['#gl','.vignette','.bgfx'],{opacity:1},0);
tl.set(S,{grid:.25,dust:.6,stars:.85,heroO:0,camZ:13.2,camRoll:0,bloom:.85},0);
breathe(0,DURATION);

/* ================= RUNDOWN — write the scenes from the CONCEPT here =================
   There is no sample scene so that no skeleton can be imitated. The shape of the calls:
     const chN = splitChars($('.txt', elN));
     tl.set(elN, {autoAlpha:1}, T);  <entrance>(chN, elN, T);
     popDot(dotN, T+.75) ONLY if the sentence actually has punctuation — titles/claims default to no period.
     mark(hlN, T+.5) ONLY if the style brief uses word highlighting — not required, not on every sentence.
     Without a highlight, emphasis comes from inWords / size / dim → full / an object beside the word.
   Opening, way of presenting features, closing: choose from the opener-concepts.md menus.
   ============================================================================== */

/* ---- DEMO ?demo=1 — a catalog of the text entrances one by one. This is a list of TOOLS, not a scene order. ---- */
if(Q.has('demo')){
  const scA=$('#sc-a'), la=$('#line-a'), ch=splitChars($('.txt',la));
  tl.set([scA,la],{autoAlpha:1},0);
  let t=.3;
  for(const [pin,pout] of [[inUp,outUp],[inDown,outDown],[inLeft,outLeft],[inRight,outRight],[inDepth,outDepth]]){
    pin(ch,la,t); pout(ch,la,t+1.15); t+=1.7; }
  inMask(ch,la,t); outDepth(ch,la,t+1.2); t+=1.8;
  inWords(ch,la,t); outUp(ch,la,t+1.3); t+=1.9;
  tl.to({},{duration:.01},t);
}
tl.to({},{duration:.01},DURATION);

/* ============ GLUE ============ */
const stage=$('#stage');
const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit); fit();

const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play');
let scrubbing=false;
(function frame(){ const t=tl.time(); render(t);
  clock.textContent=t.toFixed(2)+'s';
  if(!scrubbing)scrub.value=String(t/DURATION*1000);
  requestAnimationFrame(frame); })();

const toggle=()=>{ if(tl.paused()||tl.progress()>=1){
    if(tl.progress()>=1)tl.progress(0); tl.play(); btn.textContent='Pause';}
  else{tl.pause();btn.textContent='Play';} };
btn.onclick=toggle;
$('#btn-restart').onclick=()=>{tl.pause(0);tl.play();btn.textContent='Pause';};
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();btn.textContent='Play';});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();}
  if(/^[rR]$/.test(e.key)){tl.pause(0);tl.play();}
  if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on'); });
if(Q.has('debug'))$('#ui').classList.add('on');            // default: NO player
tl.eventCallback('onComplete',()=>{tl.play(0);});           // default: loop

/* the split is measured AFTER the font loads — a fallback gives the wrong width */
/* synchronous seek: force GSAP to write styles + draw the canvas now (rAF may be throttled) */
const seek=t=>{tl.pause();tl.time(t,false);if(gsap.ticker.tick)gsap.ticker.tick();render(t);};
window.OPENER={tl,DURATION,seek,ready:false};   // used by the console & the export scripts
/* ================= FOOTAGE — video layers bound to the timeline (like footage in After Effects) =================
   Markup : <div class="clipbox"><video class="clip" src="assets/clip.mp4" muted playsinline preload="auto"></video></div>
   Attach : const k = clip($('#v1'), {at:4, in:1.5, out:6, rate:1, hold:false});
            at = the timeline second the clip starts · in/out = the source cut (s) · rate = speed · hold = hold the last frame
   Animate: tween its WRAPPER with tl (position, scale, mask, opacity, filter). The video's contents follow the timeline clock,
            not their own — ?debug=1 scrubbing, snap.mjs, and export-frames.mjs (OPENER.seekFrame) stay precise.
   Format : MP4 H.264 (yuv420p, +faststart) or WebM VP9, no audio, 720p–1080p, 3–8 s per clip. */
var CLIPS = CLIPS || [];
function clip(el, o){ o = o || {}; el.muted = true; el.playsInline = true; el.preload = 'auto'; el.loop = false;
  try { el.pause(); } catch(e) {}
  var c = { el: el, at: o.at || 0, inT: o.in || 0, out: (o.out == null ? null : o.out), rate: o.rate || 1, hold: !!o.hold };
  (CLIPS = CLIPS || []).push(c); return c; }
function clipTime(c, t){ var end = c.out != null ? c.out : (isFinite(c.el.duration) ? c.el.duration : 1e9);
  var lt = (t - c.at) * c.rate; if (lt < 0) return null; var vt = c.inT + lt;
  if (vt > end - 1/120) { if (!c.hold) return null; vt = end - 1/60; } return vt; }
function syncClips(t, playing){ for (var i = 0; i < CLIPS.length; i++){ var c = CLIPS[i], v = c.el, vt = clipTime(c, t);
  if (vt === null) { if (!v.paused) v.pause(); continue; }
  if (playing) { if (v.playbackRate !== c.rate) v.playbackRate = c.rate; if (v.paused) v.play().catch(function(){});
    if (Math.abs(v.currentTime - vt) > .2) v.currentTime = vt; }
  else { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - vt) > 1/90) v.currentTime = vt; } } }
function seekClips(t){ return Promise.all(CLIPS.map(function(c){ return new Promise(function(res){
  var v = c.el, vt = clipTime(c, t); try { v.pause(); } catch(e) {}
  if (vt === null) return res();
  var fin = function(){ requestAnimationFrame(function(){ requestAnimationFrame(res); }); };
  if (Math.abs(v.currentTime - vt) < 1/240 && v.readyState >= 2) return fin();
  var to = setTimeout(res, 4000);
  v.addEventListener('seeked', function h(){ v.removeEventListener('seeked', h); clearTimeout(to); fin(); });
  v.currentTime = vt; }); })); }
gsap.ticker.add(function(){ if (CLIPS.length) syncClips(window.OPENER.tl.time(), !window.OPENER.tl.paused()); });
window.OPENER.clipsReady = function(){ return CLIPS.every(function(c){ return c.el.readyState >= 2; }); };
window.OPENER.seekFrame = function(t){ window.OPENER.seek(t); return seekClips(t); };   // export/snap: wait for the clip frame
document.fonts.ready.then(()=>{window.OPENER.ready=true;if(!Q.has('clean'))tl.play(0);});   // autoplay; ?clean=1 (export) does not autoplay
</script>
</body>
</html>
